version: '3.4'
services:
  db_postgres_client_profiler:
    image: 'postgres:16'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    container_name: db_postgres
    ports:
      - "15432:5432"
    env_file:
      - .env
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  metabase:
    image: metabase/metabase:v0.49.14
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    container_name: metabase
    env_file:
      - .env
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY}
      MB_SITE_URL: ${METABASE_BASE_URL}
      MB_JETTY_PORT: ${METABASE_PORT}
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      db_postgres_client_profiler:
        condition: service_healthy
    network_mode: host

  metabase_bootstrap:
    image: python:3.12-slim
    container_name: metabase_bootstrap
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      METABASE_BASE_URL: ${METABASE_BASE_URL}
      METABASE_PORT: ${METABASE_PORT}
      METABASE_SITE_NAME: ${METABASE_SITE_NAME}
      METABASE_EMAIL: ${METABASE_EMAIL}
      METABASE_PASSWORD: ${METABASE_PASSWORD}
      METABASE_ENCRYPTION_KEY: ${METABASE_ENCRYPTION_KEY}
      METABASE_DB_NAME: ${METABASE_DB_NAME}
      METABASE_DASHBOARD_NAME: ${METABASE_DASHBOARD_NAME}
      METABASE_REFRESH_SECONDS: ${METABASE_REFRESH_SECONDS}
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: ["python", "docker/metabase/bootstrap.py"]
    depends_on:
      metabase:
        condition: service_started
    network_mode: host
    restart: "no"

  migrate:
    build:
      context: ../MigrationService/
      dockerfile: Dockerfile
    container_name: migrate
    env_file:
      - .env
    ports:
      - "15432:5432"
    depends_on:
      db_postgres_client_profiler:
        condition: service_healthy
    network_mode: host


  expertise_monitoring:
    build:
      context: ../ExpertiseMonitoring/
      dockerfile: Dockerfile
    container_name: expertise_monitoring
    env_file:
      - .env
      - .env_sc
    ports:
      - "8084:8084"
    depends_on:
      db_postgres_client_profiler:
        condition: service_healthy
    network_mode: host

  gateway_app:
    build:
      context: ../GatewayApp/
      dockerfile: Dockerfile
    container_name: gateway_app
    env_file:
      - .env
      - .env_sc
    ports:
      - "8085:8085"
    depends_on:
      db_postgres_client_profiler:
        condition: service_healthy
      expertise_monitoring:
        condition: service_started
    network_mode: host

  ollama:
    image: ollama/ollama:0.30.10
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db_postgres_client_profiler:
        condition: service_healthy
    network_mode: host

  db_agent:
    build:
      context: ../DbAgent/
      dockerfile: Dockerfile
    container_name: db_agent
    env_file:
      - .env
    ports:
      - "8086:8086"
    depends_on:
      db_postgres_client_profiler:
        condition: service_healthy
      ollama:
        condition: service_healthy
    network_mode: host

volumes:
  ollama_data:
  metabase_data:
